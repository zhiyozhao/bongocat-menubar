name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p BongoCat-Menubar/.build/BongoCat\ Menubar.app/Contents/MacOS
          mkdir -p BongoCat-Menubar/.build/BongoCat\ Menubar.app/Contents/Resources

          cp BongoCat-Menubar/Info.plist "BongoCat-Menubar/.build/BongoCat Menubar.app/Contents/Info.plist"
          cp BongoCat-Menubar/Resources/Icons/*.svg "BongoCat-Menubar/.build/BongoCat Menubar.app/Contents/Resources/" 2>/dev/null || true
          cp BongoCat-Menubar/Resources/Icons/*.png "BongoCat-Menubar/.build/BongoCat Menubar.app/Contents/Resources/" 2>/dev/null || true

          SOURCES=$(find BongoCat-Menubar/Sources -name "*.swift" | sort)
          swiftc \
            -o "BongoCat-Menubar/.build/BongoCat Menubar.app/Contents/MacOS/BongoCat Menubar" \
            -target arm64-apple-macosx13.0 \
            -framework AppKit \
            -framework ApplicationServices \
            -framework CoreGraphics \
            $SOURCES

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "BongoCat-Menubar/.build/BongoCat Menubar.app"

      - name: Package DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "BongoCat Menubar" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "BongoCat Menubar.app" 150 185 \
            --app-drop-link 450 185 \
            "BongoCat-Menubar-${{ github.ref_name }}.dmg" \
            "BongoCat-Menubar/.build/BongoCat Menubar.app"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: BongoCat-Menubar-${{ github.ref_name }}.dmg
          generate_release_notes: true
          draft: true

      - name: Update Homebrew Cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 BongoCat-Menubar-${GITHUB_REF_NAME}.dmg | awk '{print $1}')
          git clone https://x-access-token:${TAP_TOKEN}@github.com/zhiyozhao/homebrew-tap.git /tmp/tap
          cd /tmp/tap
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/bongocat-menubar.rb
          sed -i '' "s/sha256 .*/sha256 \"${SHA}\"/" Casks/bongocat-menubar.rb
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A && git commit -m "bongocat-menubar ${VERSION}" && git push
