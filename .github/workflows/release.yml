name: Release

# Tag push (v*) -> universal DMG -> published GitHub release.
# The homebrew-tap repo polls releases on a schedule and bumps its casks
# itself, so this workflow intentionally stops at publishing the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for version stamping from git tags

      # Optional: sign release builds with the stable self-signed identity
      # (same cert as local builds, so users' Accessibility permission
      # survives upgrades). Falls back to ad-hoc when the secret is absent.
      - name: Import signing identity
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ]; then
            echo "No SIGNING_CERT_P12 secret, falling back to ad-hoc signing"
            exit 0
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$SIGNING_CERT_P12" | base64 -d > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
            -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          rm /tmp/cert.p12
          security find-certificate -c "BongoCat Menubar Development"

      - name: Build release DMG (universal binary)
        run: make dmg

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/release/BongoCat-Menubar-v*.dmg
          generate_release_notes: true
